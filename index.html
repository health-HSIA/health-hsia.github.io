/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const tr=e.target.closest('tr[data-href],.mv[data-href],.vsrow[data-href]');if(tr&&!e.target.closest('a,button')){location.hash=tr.dataset.href;return;}
  const rp=e.target.closest('[data-role]');if(rp){loginRole=rp.dataset.role;$$('[data-role]').forEach(x=>x.setAttribute('aria-pressed',x===rp?'true':'false'));const pw=$('#pw');if(pw)pw.focus();return;}
  const cf=e.target.closest('[data-catf]');if(cf){dashCat=cf.dataset.catf;render();return;}
  const sm=e.target.closest('[data-sum]');if(sm){setSummary(sm.dataset.sum);return;}
  const dk=e.target.closest('[data-dash]');if(dk){dashF=dk.dataset.dash;render();return;}
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='modal')closeModal();return;}
  const a=el.dataset.act,c=el.dataset.case&&caseById(el.dataset.case),m=c&&el.dataset.mv&&c.movements.find(x=>x.id===el.dataset.mv);
  if(a==='close'){closeModal();return;}
  if(a==='signout'){stopData();Backend.signOut();return;}
  if(a==='view-file'){mFile(c,el.dataset.key);return;}
  if(a==='print'){window.print();return;}
  if(a==='dl-csv'){downloadText('HSIA-protocols-'+(regF.q.trim()?'search':regF.month||'all')+'.csv',csvOf(regRows()));return;}
  if(a==='dl-month'){downloadText('HSIA-protocols-'+repMonth+'.csv',csvOf(allMv().filter(x=>x.m.date.startsWith(repMonth)).sort(mvCmp)));return;}
  if(a==='share'){mShare();return;}
  if(a==='copy-sum'){const t=$('#sumtext').value;try{await navigator.clipboard.writeText(t);toast('Summary copied');}catch(err){const ta=$('#sumtext');ta.focus();ta.select();toast('Select all and copy');}return;}
  if(a==='backup'){if(!Backend.loadAll){toast('Backup is not available.');return;}el.disabled=true;el.textContent='Preparing…';
    Backend.loadAll().then(list=>{list.forEach(x=>{if(!LIVE.has(x.id))ARCH.set(x.id,x);});rebuild();ALL_LOADED=true;
      downloadText('HSIA-protocols-backup-'+todayStr()+'.csv',csvOf(allMv().sort(mvCmp)));el.disabled=false;el.textContent='Download full backup';})
    .catch(()=>{el.disabled=false;el.textContent='Download full backup';toast('Could not prepare the backup.');});return;}
  if(a==='copy-csv'){const t=csv();try{await navigator.clipboard.writeText(t);toast('Copied '+regRows().length+' rows. Paste into Excel.');}
    catch(err){openModal(`${mHead('Copy the register','Select all and copy, then paste into Excel.')}<textarea style="min-height:220px" class="mono small" readonly>${esc(t)}</textarea><div class="btnrow"><button class="btn" data-act="close">Close</button></div>`,b=>{const ta=$('textarea',b);ta.focus();ta.select();});}
    return;}
  if(!canEdit())return;
  if(a==='recheck'){let n=0;S.cases.forEach(x=>{if(/^Set manually/.test(x.tierReason||''))return;const cl=classify(x.designation,x.grade);if(cl.tier!==Number(x.tier)){addLog(x,`Category updated from ${catName(x.tier)} to ${catName(cl.tier)} (${cl.reason})`);x.tier=cl.tier;x.movements.forEach(m=>{if(m.status==='Open'&&!m.assigned)m.attendBy=handlerOf(cl.tier);});x.tierReason=cl.reason;save(x);n++;}});render();toast(n?n+' protocol'+(n===1?'':'s')+' moved to the new categories':'All protocols already match the categories');return;}
  if(a==='tick')toggleDone(c,m);
  else if(a==='edit-mv')mFlight(c,m);
  else if(a==='add-mv')mFlight(c,null);
  else if(a==='return-mv')mFlight(c,null,Object.assign(returnOf(m),{date:''}));
  else if(a==='add-return'){const rows=$$('[data-row]');const last=readRow(rows[rows.length-1]);$('#mvRows').insertAdjacentHTML('beforeend',mvRowHtml(returnOf(last)));}
  else if(a==='dup-save'){closeModal();const f=$('#newForm');if(f){f.dataset.force='1';f.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}));}}
  else if(a==='assign')mAssign(c,m);
  else if(a==='complete')mComplete(c,m);
  else if(a==='cancel-mv')mCancel(c,m);
  else if(a==='forward')mForward(c);
  else if(a==='ack')mAck(c,el.dataset.sec);
  else if(a==='attach')mAttach(c);
  else if(a==='edit')mEdit(c);
  else if(a==='recat')mRecat(c);
  else if(a==='add-row')$('#mvRows').insertAdjacentHTML('beforeend',mvRowHtml());
  else if(a==='rm-row'){if($$('[data-row]').length>1)el.closest('[data-row]').remove();else toast('A protocol needs at least one flight');}
  else if(a==='logo-reset'){S.logo=null;saveSettings();paintLogo();render();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
  if(e.key==='Enter'&&e.target.matches('tr[data-href],.mv[data-href],.vsrow[data-href]'))location.hash=e.target.dataset.href;
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='rf-q'){regF.q=t.value;if(t.value.trim())needAll();const n=$('#rf-note');if(n)n.textContent=t.value.trim()?'Searching all months.':'Type in Search to look across all months.';$('#regTable').innerHTML=regTable();}
  if(t.name==='flight'&&t.closest('[data-row]')){const pl=$('[name=place]',t.closest('[data-row]'));if(pl&&!pl.value.trim()&&routeFor(t.value))rowAuto(t.closest('[data-row]'),'flight');}
  if(t.id==='r-test'){const r=classify(t.value,'');$('#r-testout').innerHTML=t.value?`${catBadge(r.tier)} <span style="margin-left:6px">${esc(r.reason)}. Attended by ${WHO[rule(r.tier).handler]}.</span>`:'Family members and guests get the same category as the official.';}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.pick){PICK[t.dataset.pick]=t.files&&t.files[0]||null;const box=document.getElementById(t.dataset.pick);if(box)$('.fname',box).textContent=PICK[t.dataset.pick]?PICK[t.dataset.pick].name:'No file chosen';return;}
  if((t.name==='flight'||t.name==='place'||t.name==='type')&&t.closest('[data-row]')){rowAuto(t.closest('[data-row]'),t.name);return;}
  if(t.id==='f-name'){const p=personFor(t.value);if(p){let n=0;[['#f-des','designation'],['#f-org','org'],['#f-contact','contact']].forEach(([s,k])=>{const el=$(s);if(el&&!el.value.trim()&&p[k]){el.value=p[k];n++;}});const g=$('#f-grade');if(g&&!g.value&&normGrade(p.grade)){g.value=normGrade(p.grade);n++;}if(n){updateCatBox();toast('Details filled in from an earlier protocol');}}return;}
  if(['rf-month','rf-type','rf-status','rf-cat'].includes(t.id)){regF[t.id.slice(3)]=t.value;if(t.id==='rf-month')needMonth(t.value);$('#regTable').innerHTML=regTable();}
  else if(t.id==='set-idle'){SETPREF('idle',t.value);touch();toast('Automatic sign-out: '+t.options[t.selectedIndex].text);}
  else if(t.id==='set-text'){SETPREF('zoom',t.value);applyZoom();}
  else if(t.id==='rep-month'){repMonth=t.value||repMonth;render();}
  else if(t.id==='logoFile'&&canEdit()){try{const f=await prepareFile(t,360);if(f&&/^image\//.test(f.type)){S.logo=f.data;saveSettings();paintLogo();render();toast('Logo updated for everyone');}else toast('Choose an image file.');}catch(er){toast(er.message);}}
});
document.addEventListener('submit',async e=>{
  const f=e.target;
  if(f.id==='newForm'){
    e.preventDefault();if(!canEdit())return;const err=$('#formErr');const v=id=>$(id).value.trim();
    const rows=$$('#mvRows [data-row]').map(readRow);
    const miss=[];if(!v('#f-name'))miss.push('name');if(!v('#f-des'))miss.push('designation');
    if(rows.some(r=>!r.date||!r.time||!r.flight))miss.push('date, time and flight for every flight row');
    if(miss.length){err.textContent='Fill in: '+miss.join(', ')+'.';return;}
    if(!f.dataset.force){const dups=[];rows.forEach(r=>allMv().forEach(x=>{if(x.m.status!=='Cancelled'&&fkey(x.m.flight)===fkey(r.flight)&&x.m.date===r.date&&!dups.includes(x))dups.push(x);}));if(dups.length){mDup(dups);return;}}
    delete f.dataset.force;
    const cl=classify(v('#f-des'),v('#f-grade'));
    const c=mk({vipName:v('#f-name'),designation:v('#f-des'),org:v('#f-org'),grade:v('#f-grade'),beneficiary:$('#f-ben').value,guests:v('#f-guests'),contact:v('#f-contact'),vehicles:v('#f-veh'),
      tier:cl.tier,tierReason:cl.reason,movements:rows.map(r=>mv(Object.assign(r,{attendBy:handlerOf(cl.tier)})))});
    const btn=f.querySelector('button[type=submit]');btn.disabled=true;
    let scan=null;try{scan=await storeFile(c,'letter',PICK['f-scan']);}catch(er){err.textContent=er.message;btn.disabled=false;return;}
    addLog(c,'Protocol registered as '+catName(cl.tier));
    if(scan)addLog(c,'Protocol letter attached: '+scan.name);
    save(c);location.hash='case-'+c.id;toast('Protocol saved. Next: forward the letter and assign.');
  }
  else if(f.id==='loginForm'){
    e.preventDefault();const pw=$('#pw').value;const er=$('#loginErr');const btn=$('#loginBtn');
    if(!pw){er.textContent='Enter the password.';return;}
    btn.disabled=true;btn.textContent='Signing in…';er.textContent='';window.__justSignedIn=true;touch();
    Backend.signIn('doctor',pw).catch(x=>{btn.disabled=false;btn.textContent='Sign in';
      const code=(x&&x.code)||'unknown';const who='Doctor';
      const MSG={
        'auth/invalid-credential':'Wrong password, or the '+who+' account does not exist in Firebase with the expected email.',
        'auth/wrong-password':'Wrong password for '+who+'.',
        'auth/user-not-found':'No '+who+' account found in Firebase with the expected email.',
        'auth/invalid-login-credentials':'Wrong password, or the '+who+' account does not exist in Firebase with the expected email.',
        'auth/operation-not-allowed':'Email/Password sign-in is switched off in Firebase (Authentication → Sign-in method).',
        'auth/user-disabled':'This account has been disabled in Firebase.',
        'auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.',
        'auth/network-request-failed':'No internet connection. Check the connection and try again.',
        'auth/invalid-api-key':'The Firebase settings in firebase-config.js are not correct.',
        'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'The Firebase settings in firebase-config.js are not correct.',
        'auth/unauthorized-domain':'This website address is not in Firebase Authentication → Settings → Authorized domains.'
      };
      er.innerHTML=esc(MSG[code]||'Could not sign in.')+'<div class="small muted" style="margin-top:4px;font-weight:500">Account: '+esc((window.HSIA_ACCOUNTS||{})[loginRole]||'')+' · Code: '+esc(code)+'</div>';});
  }
  else if(f.id==='rulesForm'){
    e.preventDefault();if(!canEdit())return;S.rules=JSON.parse(JSON.stringify(S.rules||defaultRules()));$$('[data-r]',f).forEach(i=>{S.rules[+i.dataset.r][i.dataset.k]=i.value;});S.rankKw=Object.assign(defaultRankKw(),S.rankKw||{});$$('[data-kw]',f).forEach(t=>{S.rankKw[t.dataset.kw]=t.value;});saveSettings();render();toast('Settings saved for everyone');
  }
});

const PREF=k=>{try{return localStorage.getItem('hsia-'+k);}catch(e){return null;}};
const SETPREF=(k,v)=>{try{localStorage.setItem('hsia-'+k,String(v));}catch(e){}};
const idleMins=()=>Number(PREF('idle'))||30;
const textZoom=()=>Number(PREF('zoom'))||1;
function applyZoom(){document.documentElement.style.zoom=textZoom()===1?'':String(textZoom());}
function touch(){SETPREF('last',Date.now());}
function idleCheck(){
  if(!USER)return;const last=Number(PREF('last'))||Date.now();
  if(Date.now()-last>idleMins()*6e4){stopData();Backend.signOut();toast('Signed out after '+idleMins()+' minutes without use.');}
}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(USER)touch();},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')idleCheck();});
setInterval(idleCheck,30000);
function boot(){
  applyZoom();
  document.body.insertAdjacentHTML('beforeend',airportList());
  render();
  Backend.onAuth(u=>{
    if(u&&u.role!=='doctor'){Backend.signOut();toast('Only the doctors\' account can use the registry.');return;}
    if(u&&USER===null&&PREF('last')&&Date.now()-Number(PREF('last'))>idleMins()*6e4&&!window.__justSignedIn){Backend.signOut();return;}
    window.__justSignedIn=false;if(u)touch();
    USER=u;MODE=u?u.role:null;applyMode();
    if(u){READY=false;startData();}else stopData();
    render();
  });
}
if(window.Backend)boot();else window.addEventListener('backend-ready',boot,{once:true});
window.addEventListener('backend-failed',()=>{$('#view').innerHTML='<div class="card"><h2>Could not connect</h2><p class="muted">The registry could not reach Firebase. Check the internet connection, and check that firebase-config.js has the settings from your Firebase project.</p></div>';});
</script>
<script>
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
