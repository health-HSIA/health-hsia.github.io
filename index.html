<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSIA Protocol Registry</title>
<meta name="theme-color" content="#081426">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Protocols">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: night-airfield hero with the org title and a split-flap "next protocol" board; pill tabs overlap its lower edge; quiet light content below. */
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#f7f9fc; --ink:#0d1a2b; --muted:#5a6779; --line:#e1e6ee;
  --accent:#1f4e8c; --accent-ink:#ffffff; --accent-soft:#e7eef9;
  --vvip:#d92d20; --vvip-soft:#fde8e6; --vip:#b7791f; --vip-soft:#fbf0d9; --cour:#0e8a7d; --cour-soft:#dcf3ef; --cat-ink:#ffffff;
  --ok:#15803d; --ok-soft:#e2f5e8; --warn:#c2410c; --warn-soft:#fdede3; --info:#1f4e8c; --info-soft:#e7eef9; --arr:#1d4ed8; --arr-soft:#e9f0ff; --arr-line:#bcd0fb; --dep:#7e22ce; --dep-soft:#f4ebff; --dep-line:#dcc4fb;
  --night:#081426; --night-2:#0d2244; --amber:#ffb627; --board:#050c18; --cell:#101b2e;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(13,26,43,.05),0 10px 30px -14px rgba(13,26,43,.22);
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a111c; --surface:#111a27; --surface-2:#0e1622; --ink:#e6ecf3; --muted:#97a5b7; --line:#22304a;
  --accent:#86b4f2; --accent-ink:#06142a; --accent-soft:#152a48;
  --vvip:#ff6f63; --vvip-soft:#3b1613; --vip:#f1b84d; --vip-soft:#382a10; --cour:#3fcab9; --cour-soft:#0f312d; --cat-ink:#0b1220;
  --ok:#55d98a; --ok-soft:#0f2e1b; --warn:#ff9a5c; --warn-soft:#3a1e0f; --info:#86b4f2; --info-soft:#152a48; --arr:#8fb3ff; --arr-soft:#16244a; --arr-line:#2b4486; --dep:#d1a4ff; --dep-soft:#2a1842; --dep-line:#4f2d7c;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 12px 30px -16px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a111c; --surface:#111a27; --surface-2:#0e1622; --ink:#e6ecf3; --muted:#97a5b7; --line:#22304a;
  --accent:#86b4f2; --accent-ink:#06142a; --accent-soft:#152a48;
  --vvip:#ff6f63; --vvip-soft:#3b1613; --vip:#f1b84d; --vip-soft:#382a10; --cour:#3fcab9; --cour-soft:#0f312d; --cat-ink:#0b1220;
  --ok:#55d98a; --ok-soft:#0f2e1b; --warn:#ff9a5c; --warn-soft:#3a1e0f; --info:#86b4f2; --info-soft:#152a48; --arr:#8fb3ff; --arr-soft:#16244a; --arr-line:#2b4486; --dep:#d1a4ff; --dep-soft:#2a1842; --dep-line:#4f2d7c;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 12px 30px -16px rgba(0,0,0,.6); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(24px,3.4vw,32px);font-weight:800;font-stretch:108%;line-height:1.1}
h2{font-size:17px;font-weight:700;font-stretch:105%}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;color:#e9eef7;
  background:radial-gradient(900px 380px at 88% -20%,rgba(255,182,39,.18),transparent 62%),radial-gradient(700px 460px at -5% 125%,rgba(14,138,125,.42),transparent 60%),linear-gradient(165deg,var(--night-2),var(--night) 62%)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);mask-image:linear-gradient(180deg,#000,transparent 85%);pointer-events:none}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:30px;height:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 34px,transparent 34px 62px);opacity:.5}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;padding-top:30px;padding-bottom:74px}
.idblock{display:flex;gap:18px;align-items:center;min-width:0}
.logo{flex:0 0 auto;width:76px;height:76px;border-radius:18px;background:#fff;display:grid;place-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.6),inset 0 0 0 1px rgba(13,26,43,.06);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;padding:6px}
.logo .ph{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--night)}
.logo .ph svg{width:30px;height:30px}
.logo .ph b{font:800 12px/1 var(--display);font-stretch:120%;letter-spacing:.12em}
.l1{font:700 clamp(12.5px,1.6vw,17px)/1.25 var(--display);font-stretch:118%;letter-spacing:.06em;color:#dfe7f3}
.l2{font:600 clamp(11px,1.2vw,13px)/1.3 var(--body);letter-spacing:.24em;color:var(--amber);margin-top:6px}
.l3{font:900 clamp(32px,5.4vw,58px)/.95 var(--display);font-stretch:112%;letter-spacing:-.02em;margin-top:8px;color:#fff}
.l3 span{color:transparent;-webkit-text-stroke:1.2px rgba(255,255,255,.75)}
.edition{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.22);color:#cfd9e8;background:rgba(255,255,255,.05)}
.edition[hidden]{display:none}
.edition i{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px rgba(255,182,39,.22)}

/* split-flap board */
.board{background:var(--board);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 50px -20px rgba(0,0,0,.8);min-width:330px;text-decoration:none;color:inherit;display:block}
.board:hover{border-color:rgba(255,182,39,.4)}
.board .bl{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;font:600 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:#8c9ab0}
.board .bl b{color:var(--amber);font-weight:600}
.flaps{display:flex;gap:16px;margin-top:12px;align-items:flex-end;flex-wrap:wrap}
.flapgrp{display:flex;flex-direction:column;gap:6px}
.flapgrp small{font:600 9.5px/1 var(--body);letter-spacing:.18em;color:#6f7d93}
.cells{display:flex;gap:3px}
.c{position:relative;width:24px;height:34px;display:grid;place-items:center;background:linear-gradient(180deg,#14223a 0 50%,var(--cell) 50%);border-radius:4px;font:700 19px/1 var(--mono);color:var(--amber);box-shadow:inset 0 -1px 0 rgba(0,0,0,.6)}
.c::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.75)}
.c.sep{background:none;box-shadow:none;width:10px}
.c.sep::after{display:none}
.board .who{margin-top:14px;color:#fff;font-weight:600;font-size:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.board .who .dsg{color:#9fb0c8;font-weight:400;font-size:13px}
.board .none{margin-top:14px;font:600 13px var(--mono);color:#6f7d93;letter-spacing:.1em}

/* ---------- tabs ---------- */
.tabsbar{position:sticky;top:8px;z-index:20;margin-top:-30px}
.tabs{display:flex;gap:4px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14.5px}
.tabs a:hover{color:var(--ink);background:var(--surface-2)}
.tabs a[aria-current="page"]{background:var(--night);color:#fff}
.tabs .count{font:700 11px/1 var(--mono);background:var(--vvip);color:#fff;border-radius:999px;padding:3px 7px}
.tabs .cta{margin-left:auto;background:var(--amber);color:#1b1300}
.tabs .cta:hover{background:#ffc552;color:#1b1300}

main.wrap{padding-top:28px;padding-bottom:80px;display:flex;flex-direction:column;gap:22px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead p{margin:6px 0 0;color:var(--muted)}
.eyebrow{font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.banner b{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card.flush{padding:0;overflow:hidden}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px 12px}
.card:not(.flush) > .cardhead{padding:0 0 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr}}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:128px;padding:14px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative;transition:transform .15s,border-color .15s}
.kpi:hover{transform:translateY(-2px);border-color:var(--accent)}
.kpi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpi .k{font:700 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kpi .n{font:800 42px/1 var(--display);font-stretch:112%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font-size:13px;line-height:1.3;color:var(--muted)}
.kpi.alert{background:linear-gradient(180deg,var(--warn-soft),var(--surface) 70%);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.kpi.alert .n{color:var(--warn)}
.kpi.good .n{color:var(--ok)}
.kpi.sched .n{color:var(--ink)}
.kpi[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.kpi[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:translateX(-50%) rotate(45deg)}

/* ---------- today overview ---------- */
.overview{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.25fr) minmax(230px,.72fr);gap:16px;align-items:stretch}
.overview.si{grid-template-columns:minmax(0,2fr) minmax(230px,.8fr)}
@media (max-width:1100px){.overview{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.overview .sched{grid-column:1/-1}.overview.si .sched{grid-column:auto}}
@media (max-width:680px){.overview,.overview.si{grid-template-columns:1fr}.overview.si .sched{grid-column:1/-1}}
.sched{position:relative;overflow:hidden;border-radius:20px;padding:20px 22px 18px;color:#e9eef7;
  background:radial-gradient(420px 220px at 100% 0%,rgba(255,182,39,.16),transparent 65%),radial-gradient(380px 260px at 0% 110%,rgba(14,138,125,.35),transparent 60%),linear-gradient(160deg,var(--night-2),var(--night));
  box-shadow:0 18px 40px -22px rgba(8,20,38,.75);border:1px solid rgba(255,255,255,.06)}
.sched::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.2px);background-size:18px 18px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%);pointer-events:none}
.schead{position:relative;display:flex;justify-content:space-between;align-items:center;font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:#8fa0b8}
.live{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);letter-spacing:.06em;color:#cfd9e8}
.live i{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.2)}
.stats{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px}
.stat{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:8px 14px 10px;border-left:1px solid rgba(255,255,255,.1);border-radius:12px;transition:background .15s}
.stat:first-child{border-left-color:transparent}
button.stat{cursor:pointer}
button.stat:hover{background:rgba(255,255,255,.05)}
.stat .n{font:800 clamp(40px,4.6vw,56px)/1 var(--display);font-stretch:112%;letter-spacing:-.03em;color:#fff;font-variant-numeric:tabular-nums}
.stat.hot .n{color:var(--amber)}
.stat .l{font:600 13px/1 var(--body);color:#9fb0c8}
.stat[aria-pressed="true"]{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,182,39,.45)}
.stat[aria-pressed="true"] .l{color:var(--amber)}
.stat:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.week{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;height:104px;margin-top:16px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.12)}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-height:0}
.day .bar{width:100%;max-width:30px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.12))}
.day.zero .bar{background:rgba(255,255,255,.08)}
.day.today .bar{background:linear-gradient(180deg,#ffd27a,var(--amber));box-shadow:0 0 18px -2px rgba(255,182,39,.55)}
.day .dn{font:700 11.5px/1 var(--mono);color:#cfd9e8}
.day.zero .dn{color:#5f6f86}
.day .dd{font:700 9.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:#7d8ca3}
.day.today .dd{color:var(--amber)}
.attn{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 14px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.attnhead{display:flex;justify-content:space-between;align-items:center;padding:0 6px 6px}
.attnhead .tot{font:700 12px/1 var(--body);padding:6px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.attnhead .tot.clear{background:var(--ok-soft);color:var(--ok)}
.arow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:14px;border:1px solid transparent;transition:background .15s,border-color .15s}
.arow:hover{background:var(--surface-2)}
.arow:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.arow .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn)}
.arow .ic svg{width:20px;height:20px}
.arow.clear .ic{background:var(--ok-soft);color:var(--ok)}
.arow .t{display:block;font-weight:700;font-size:14.5px;line-height:1.25}
.arow .s{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.arow .n{font:800 30px/1 var(--display);font-stretch:112%;color:var(--warn);font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.arow.clear .n{color:var(--ok);opacity:.7}
.arow[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.donecard{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);transition:border-color .15s}
button.donecard{cursor:pointer}
button.donecard:hover{border-color:var(--ok)}
.donecard[aria-pressed="true"]{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),var(--shadow)}
.donecard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ring{position:relative;width:132px;height:132px;display:block}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .trk{stroke:var(--line)}
.ring .prg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring .rv b{font:800 40px/1 var(--display);font-stretch:112%;color:var(--ink)}
.ring .rv small{font:600 12px/1 var(--body);color:var(--muted)}
.rl{font-size:13px;font-weight:600;color:var(--muted)}


.daylabel{padding:12px 18px}
.dl{display:flex;align-items:center;gap:10px;letter-spacing:0;text-transform:none}
.dl-day{font:800 17px/1 var(--display);font-stretch:108%;color:var(--accent)}
.daylabel.istoday .dl-day{color:var(--warn)}
.dl-date{font:700 13.5px/1 var(--mono);background:var(--night);color:var(--amber);padding:6px 9px;border-radius:7px;letter-spacing:.03em}
/* register boxes */
.dbox{display:inline-flex;flex-direction:column;align-items:center;gap:4px;background:var(--night);color:var(--amber);padding:8px 11px;border-radius:11px;box-shadow:0 6px 16px -10px rgba(8,20,38,.8)}
.dbox b{font:700 16px/1 var(--mono);letter-spacing:.02em}
.dbox small{font:700 9.5px/1 var(--body);letter-spacing:.16em;color:#8c9ab0;text-transform:uppercase}
.tbox{display:inline-flex;flex-direction:column;gap:4px;font:700 18px/1 var(--mono);padding:9px 11px;border-radius:11px;background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink)}
.tbox small{font:600 10.5px/1.2 var(--body);color:var(--muted)}
.dir{display:inline-flex;align-items:center;gap:6px;font:700 12.5px/1 var(--body);padding:8px 11px 8px 9px;border-radius:10px;border:1.5px solid;white-space:nowrap}
.dir svg{width:15px;height:15px}
.dir.arr{color:var(--arr);background:var(--arr-soft);border-color:var(--arr-line)}
.dir.dep{color:var(--dep);background:var(--dep-soft);border-color:var(--dep-line)}
.dom{display:inline-block;margin-top:6px;font:700 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:4px 6px}
table.reg td.date,table.reg td.time{vertical-align:middle}
/* report summary */
.repsum .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.repsum .meter{position:relative;margin-top:16px;height:10px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.repsum .meter span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#34d399,#10b981)}
.repsum .cats{position:relative;display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.repsum .cats > span{display:inline-flex;align-items:center;gap:8px;font:600 13px/1 var(--body);color:#cfd9e8;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:6px 10px 6px 6px;border-radius:999px}
.repsum .cats > span > b{font:700 13px var(--mono);color:#fff}
/* sign in */
.login{max-width:520px;width:100%;margin:10px auto 0;display:flex;flex-direction:column;gap:20px;padding:26px}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rolepick button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2)}
.rolepick button b{font:800 16px/1.1 var(--display);font-stretch:108%}
.rolepick button small{font-size:12.5px;color:var(--muted);line-height:1.3}
.rolepick button[aria-pressed="true"]{border-color:var(--night);background:var(--night);color:#fff}
.rolepick button[aria-pressed="true"] small{color:#b9c6d8}
.rolepick button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:420px){.rolepick{grid-template-columns:1fr}}
.tabs .signout{flex:0 0 auto;font:600 14px var(--body);color:var(--muted);background:none;border:0;padding:10px 14px;border-radius:10px;cursor:pointer}
.tabs .signout:hover{color:var(--vvip);background:var(--surface-2)}
.tabs .signout.push{margin-left:auto}
.btn:disabled{opacity:.55;cursor:wait}
/* done tick */
.tick{flex:0 0 auto;width:34px;height:34px;padding:0;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:transparent;transition:background .15s,border-color .15s,color .15s}
.tick svg{width:18px;height:18px}
.tick:hover{border-color:var(--ok);color:var(--ok)}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mv{cursor:pointer}
.mv .side .row{align-items:center}
.mv.isdone .nm,.mv.isdone .fl{opacity:.6}
table.reg td.tickcell{vertical-align:middle;width:56px}
/* improvements */
.hero{padding-top:env(safe-area-inset-top)}
.logo img{padding:4px}
div.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.filepick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1px dashed var(--line);border-radius:10px;background:var(--surface-2)}
.filepick .btn svg{width:16px;height:16px}
.filepick .fname{font-weight:500;overflow-wrap:anywhere}
.btn svg{width:16px;height:16px}
input.filled{background:var(--ok-soft);transition:background .4s}
.chiprow{padding:0 18px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipf{all:unset;box-sizing:border-box;cursor:pointer;font:600 12.5px/1 var(--body);padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);background:var(--surface)}
.chipf:hover{color:var(--ink)}
.chipf[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:#fff}
.chipf.vvip[aria-pressed="true"]{background:var(--vvip);border-color:var(--vvip);color:var(--cat-ink)}
.chipf.vip[aria-pressed="true"]{background:var(--vip);border-color:var(--vip);color:var(--cat-ink)}
.chipf.cour[aria-pressed="true"]{background:var(--cour);border-color:var(--cour);color:var(--cat-ink)}
.chipf:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.callbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:2px solid var(--line);color:var(--accent);background:var(--surface)}
.callbtn svg{width:16px;height:16px}
.callbtn:hover{border-color:var(--accent)}
a.tel{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}
a.tel svg{width:13px;height:13px}
a.flightlink{color:inherit;text-decoration:none;font-weight:700}
td a.small.flightlink{display:inline-block;margin-top:4px;color:var(--accent);font-weight:600}
.mv.soon{background:linear-gradient(90deg,var(--vvip-soft),transparent 40%)}
.mv.soon::before{width:5px;background:var(--vvip)}
details.donegrp{border-top:1px solid var(--line)}
details.donegrp summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 18px;font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ok)}
details.donegrp summary::-webkit-details-marker{display:none}
details.donegrp summary svg{width:14px;height:14px}
details.donegrp summary::after{content:"Show";margin-left:auto;color:var(--muted);letter-spacing:.06em}
details.donegrp[open] summary::after{content:"Hide"}
.tabs .sm{display:none}
.printhead{display:none}
@media (max-width:640px){
  .tabsbar{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;padding:0 8px calc(8px + env(safe-area-inset-bottom));z-index:30;max-width:none}
  .tabs{gap:2px;padding:5px;border-radius:16px;box-shadow:0 -6px 24px -10px rgba(8,20,38,.35),var(--shadow)}
  .tabs a{flex:1 1 0;justify-content:center;padding:11px 4px;font-size:13px}
  .tabs .cta{margin-left:0}
  .tabs .lg{display:none}.tabs .sm{display:inline}
  .tabs .signout{display:none}
  .hero .wrap{padding-bottom:40px}
  main.wrap{padding-bottom:120px}
  footer{padding-bottom:110px}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
@media print{
  .hero,.tabsbar,footer,#toast,.btn,.filters,.tick,.callbtn,.chiprow,.modal,#rf-note,a.small.flightlink{display:none!important}
  body{background:#fff}
  .printhead{display:block;font:600 12px var(--body);color:#333;padding-top:10px}
  main.wrap{padding-top:10px}
  .card,.attn,.donecard{box-shadow:none!important}
  .sched,.dbox,.chipboard,table.reg thead th,.cat,.pill,.dir,.fill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  details.donegrp>*{display:block}
  .scroll{overflow:visible}
  table.reg{font-size:11px}
}
/* batch 3 */
.overview.noring{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:1100px){.overview.noring .sched{grid-column:auto}}
@media (max-width:760px){.overview.noring{grid-template-columns:1fr}}
.chipboard span{letter-spacing:.1em}
.gear{position:absolute;z-index:3;top:calc(14px + env(safe-area-inset-top));right:16px;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;color:#e9eef7;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.gear:hover,.gear[aria-current="page"]{background:var(--amber);color:#1b1300;border-color:var(--amber)}
.gear svg{width:21px;height:21px}
.gear[hidden]{display:none}
@media (min-width:821px){.hero .board{margin-top:48px}}
@media (max-width:820px){.hero .idblock{padding-right:52px}}
.vvipstrip{border-radius:var(--r);border:1.5px solid color-mix(in srgb,var(--vvip) 45%,var(--line));background:linear-gradient(180deg,var(--vvip-soft),var(--surface) 85%);box-shadow:var(--shadow);overflow:hidden}
.vshead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;font:600 13px var(--body);color:var(--vvip)}
.vsrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid color-mix(in srgb,var(--vvip) 18%,var(--line));cursor:pointer}
.vsrow:hover{background:color-mix(in srgb,var(--vvip-soft) 60%,transparent)}
.vsrow.isdone .vsn,.vsrow.isdone .vst{opacity:.55}
.vst{display:flex;flex-direction:column;gap:3px;background:var(--board);border-radius:9px;padding:7px 9px;min-width:84px}
.vst b{font:700 17px/1 var(--mono);color:var(--amber)}
.vst small{font:700 9px/1 var(--body);letter-spacing:.1em;color:#8c9ab0}
.vsn{display:flex;flex-direction:column;gap:3px;min-width:0}
.vsn b{font-weight:700}
.vsn small{font-size:12.5px;color:var(--muted)}
.vsa{display:flex;gap:6px;align-items:center}
@media (max-width:520px){.vsrow{grid-template-columns:auto minmax(0,1fr)}.vsa{grid-column:1/-1;justify-content:flex-end}}
@media print{.gear,.vsa{display:none!important}}
/* ---------- category & status ---------- */
.cat{display:inline-flex;align-items:center;gap:6px;font:800 11px/1 var(--display);font-stretch:115%;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px 5px 8px;border-radius:6px;color:var(--cat-ink);white-space:nowrap}
.cat::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.85}
.cat.vvip{background:var(--vvip)} .cat.vip{background:var(--vip)} .cat.cour{background:var(--cour)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.crit{background:var(--vvip-soft);color:var(--vvip)}
.pill.muted{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.att{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1.2 var(--body);color:var(--ink)}
.att svg{width:15px;height:15px;color:var(--muted)}
.att.none{color:var(--warn)}
.att.none svg{color:var(--warn)}

/* ---------- movement rows ---------- */
.daylabel{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mv{--cat:var(--line);display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);text-decoration:none;color:inherit;position:relative}
.daylabel + .mv{border-top:0}
.mv::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--cat)}
.mv.vvip{--cat:var(--vvip)} .mv.vip{--cat:var(--vip)} .mv.cour{--cat:var(--cour)}
.mv:hover{background:var(--surface-2)}
.chipboard{background:var(--board);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.chipboard b{font:700 19px/1 var(--mono);color:var(--amber);letter-spacing:.02em}
.chipboard span{font:700 9.5px/1 var(--body);letter-spacing:.16em;color:#8c9ab0}
.mv .fl{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.mv .fl .mono{font-weight:700;font-size:15px}
.mv .fl .rt{color:var(--muted);font-size:13px;font-family:var(--mono)}
.mv .nm{font-weight:700;margin-top:3px}
.mv .ds{font-size:13px;color:var(--muted)}
.mv .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.mv .side .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.flag{font-size:12px;color:var(--warn);font-weight:600}
@media (max-width:620px){
  .mv{grid-template-columns:78px minmax(0,1fr);gap:12px;padding:14px 14px 14px 16px}
  .mv .side{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start}
  .mv .side .row{justify-content:flex-start}
  .chipboard b{font-size:17px}
}
.listtitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.empty{padding:28px 18px;color:var(--muted);text-align:center}

/* action list */
.act{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.act:hover{background:var(--surface-2)}
.act .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.act.crit .dot{background:var(--vvip);box-shadow:0 0 0 4px var(--vvip-soft)}
.act .what{font-weight:600;font-size:14px}
.act .ctx{font-size:12.5px;color:var(--muted)}
.act .when{font:600 12px var(--mono);color:var(--muted);white-space:nowrap}

/* ---------- buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px/1.2 var(--body);padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--night);color:#fff;border-color:var(--night)}
.btn.primary:hover{background:var(--night-2);color:#fff}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#1b1300}
.btn.amber:hover{background:#ffc552;color:#1b1300}
.btn.danger{color:var(--vvip)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
label.f .req{color:var(--vvip)}
input,select,textarea{width:100%;font:15px/1.35 var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input[type=file]{padding:10px;background:var(--surface-2);border-style:dashed}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.fgrid .wide{grid-column:1/-1}
.formsec{display:flex;flex-direction:column;gap:14px}
.secno{display:flex;align-items:center;gap:10px;font:800 12px/1 var(--display);font-stretch:118%;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);padding-top:6px}
.secno b{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--night);color:var(--amber);font:700 12px var(--mono)}
.mvrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) auto;gap:10px;align-items:end;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
@media (max-width:900px){.mvrow{grid-template-columns:repeat(2,minmax(0,1fr))}.mvrow .rm{grid-column:1/-1}}
.catbox{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.err{color:var(--vvip);font-size:13px;font-weight:600}

/* ---------- case page ---------- */
.casehead{position:relative;overflow:hidden}
.casehead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cat,var(--line))}
.casehead.vvip{--cat:var(--vvip)} .casehead.vip{--cat:var(--vip)} .casehead.cour{--cat:var(--cour)}
.steps{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:s}
.steps li{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);padding-right:8px}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);font:700 12px var(--mono);position:relative;z-index:1}
.steps li::after{content:"";position:absolute;top:13px;left:26px;right:0;height:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li.done{color:var(--ink)}
.steps li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.done::after{background:var(--ok)}
.steps li.now{color:var(--accent)}
.steps li.now::before{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 16px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;overflow-wrap:anywhere}
dd.missing{color:var(--warn);font-weight:600}
.secrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.secrow:first-of-type{border-top:0}
.mvtable{width:100%;border-collapse:collapse;font-size:14px}
.mvtable th{text-align:left;font:700 10.5px/1 var(--body);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.mvtable td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:top}
.mvtable tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.log{list-style:none;margin:0;padding:0;font-size:13.5px}
.log li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log time{font:500 12px var(--mono);color:var(--muted)}
.thumb{display:inline-flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer;color:var(--ink);font:600 13px var(--body);max-width:100%}
.thumb img{width:48px;height:48px;object-fit:cover;border-radius:6px}
.thumb .doc{display:grid;place-items:center;width:48px;height:48px;border-radius:6px;background:var(--night);color:var(--amber);font:700 11px var(--mono)}
.thumb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- register ---------- */
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.filters label.f{min-width:150px;flex:1}
table.reg{width:100%;border-collapse:collapse;font-size:14px}
table.reg thead th{background:var(--night);color:#cdd8e8;font:700 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;text-align:left;padding:13px 14px;white-space:nowrap}
table.reg td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.reg tr.newday td{border-top:2px solid var(--line)}
table.reg td.date{font:700 13px var(--mono);white-space:nowrap}
table.reg td.time{font:600 13px var(--mono);white-space:nowrap}
table.reg tbody tr{cursor:pointer}
table.reg tbody tr:hover td{background:var(--surface-2)}
@media (max-width:760px){
  table.reg thead{display:none}
  table.reg,table.reg tbody,table.reg tr,table.reg td{display:block;width:100%}
  table.reg tr{padding:12px 16px;border-bottom:1px solid var(--line)}
  table.reg td{border:0;padding:3px 0;display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px}
  table.reg td::before{content:attr(data-label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:700;padding-top:2px}
  table.reg tr.newday td{border:0}
}
/* reports */
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(110px,40%) minmax(0,1fr) 34px;gap:12px;align-items:center;font-size:13.5px}
.barrow .track{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.barrow .fill{display:block;height:100%;border-radius:999px;background:var(--accent)}
.barrow .fill.vvip{background:var(--vvip)} .barrow .fill.vip{background:var(--vip)} .barrow .fill.cour{background:var(--cour)}
.barrow .v{font:700 13px var(--mono);text-align:right}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(5,12,24,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.sheet{background:var(--surface);color:var(--ink);border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.sheet img.full{max-width:100%;border-radius:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);background:var(--night);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}
footer{max-width:1240px;margin:0 auto;padding:0 24px 40px;font-size:12px;color:var(--muted)}
@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr;padding-top:22px;padding-bottom:66px;gap:20px}
  .board{min-width:0}
  .wrap{padding:0 16px}
  .logo{width:62px;height:62px;border-radius:15px}
  .c{width:21px;height:30px;font-size:17px}
}
@media (max-width:420px){.idblock{align-items:flex-start}.c{width:19px;height:28px;font-size:15px}.flaps{gap:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script type="module">
/* Firebase connection. Version pinned; the app talks to Firebase only through window.Backend. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, getDoc, getDocs, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
try{
  const app=initializeApp(window.FIREBASE_CONFIG);
  const auth=getAuth(app);
  const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  const ACC=window.HSIA_ACCOUNTS;
  const roleOf=email=>email===ACC.doctor?'doctor':email===ACC.si?'si':null;
  window.Backend={
    onAuth:cb=>onAuthStateChanged(auth,u=>cb(u?{email:u.email,role:roleOf(u.email)}:null)),
    signIn:(role,pw)=>signInWithEmailAndPassword(auth,ACC[role],pw),
    signOut:()=>signOut(auth),
    watchRecent:(since,cb,err)=>onSnapshot(query(collection(db,'protocols'),where('lastDate','>=',since)),snap=>cb(snap.docs.map(d=>d.data())),err),
    loadMonth:month=>getDocs(query(collection(db,'protocols'),where('months','array-contains',month))).then(s=>s.docs.map(d=>d.data())),
    getCase:id=>getDoc(doc(db,'protocols',id)).then(d=>d.exists()?d.data():null),
    saveCase:c=>setDoc(doc(db,'protocols',c.id),c),
    watchSettings:cb=>onSnapshot(doc(db,'settings','main'),d=>cb(d.exists()?d.data():null),()=>cb(null)),
    saveSettings:s=>setDoc(doc(db,'settings','main'),s),
    watchLookups:cb=>onSnapshot(doc(db,'settings','lookups'),d=>cb(d.exists()?d.data():null),()=>cb(null)),
    saveLookups:o=>setDoc(doc(db,'settings','lookups'),o,{merge:true}),
    loadAll:()=>getDocs(collection(db,'protocols')).then(s=>s.docs.map(d=>d.data())),
    putFile:f=>{const ref=doc(collection(db,'files'));return {id:ref.id,done:setDoc(ref,f)};},
    getFile:id=>getDoc(doc(db,'files',id)).then(d=>d.exists()?d.data():null)
  };
  window.dispatchEvent(new Event('backend-ready'));
}catch(e){console.error(e);window.dispatchEvent(new Event('backend-failed'));}
</script>
<script>
"use strict";
let MODE=null;   // set at sign-in: "doctor" = Chief Airport Health Officer and doctors (full access); "si" = Sanitary Inspectors (view only)
let USER=null, READY=false;
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function addDays(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return ymd(d);}
const todayStr=()=>ymd(new Date());
const tomorrowStr=()=>addDays(1);
const dt=m=>new Date(m.date+'T'+m.time+':00');
const parseStamp=s=>s?new Date(s.replace(' ','T')+':00'):null;
function dmy(s){const p=s.split('-');return p[2]+'.'+p[1]+'.'+p[0].slice(2);}
function longDate(s){return new Date(s+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function shortDate(s){return new Date(s+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'});}
function nowStamp(){const d=new Date();return ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes());}

let seq=100;
const uid=p=>p+Date.now().toString(36)+(++seq).toString(36)+Math.random().toString(36).slice(2,8);
function rel(ms){const h=(ms-Date.now())/36e5;const a=Math.abs(h);let t;if(a<1)t=Math.max(1,Math.round(a*60))+' min';else if(a<48)t=Math.round(a)+' h';else t=Math.round(a/24)+' d';return h>=0?'in '+t:t+' ago';}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600);}
const SEC={protocol:'Protocol section',vip:'VIP lounge section'};

const ICON={

  si:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>',
  none:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>'
};

/* ---------- seed data (fictional) ---------- */
function defaultRules(){return [
  {tier:1,name:'Ministerial',handler:'Doctor',note:'Ministerial / constitutional office holder. Duty Doctor attends in person'},
  {tier:2,name:'VIP',handler:'Doctor',note:'Grade-1 to Grade-3. Duty Doctor attends'},

];}
const RANKS=[['MIN','Ministerial / Constitutional'],['1','Grade-1'],['2','Grade-2'],['3','Grade-3'],['4','Grade-4 or below']];

  MIN:'minister, state minister, deputy minister, prime minister, chief adviser, special assistant to the prime minister, adviser to the prime minister, advisor to the prime minister, speaker, deputy speaker, chief justice, chief whip, whip, member of parliament, mp, attorney general, comptroller and auditor general, public service commission, anti-corruption commission, anti corruption commission, election commission, chief election commissioner, election commissioner, human rights commission, information commission, standing committee chairman',
  '1':'secretary, senior secretary, principal secretary, cabinet secretary, director general, dg, vice chancellor, vice-chancellor',
  '2':'additional secretary, principal, additional director general, adg, pro-vice chancellor, pro vice chancellor',
  '3':'director, line director, joint secretary, professor',
  '4':'deputy secretary, senior assistant secretary, assistant secretary, deputy director, assistant director, associate professor, assistant professor, programme manager, deputy programme manager, private secretary, personal secretary, assistant private secretary, civil surgeon, medical officer, officer'

const normGrade=g=>{g=String(g||'');if(g==='VVIP')return 'MIN';if(['5','6'].includes(g))return '4';return RANK_TIER[g]?g:'';};
const rankLabel=g=>{const r=RANKS.find(x=>x[0]===normGrade(g));return r?r[1]:'';};
const rankOptions=sel=>`<option value="">Not stated</option>${RANKS.map(([v,l])=>`<option value="${v}"${normGrade(sel)===v?' selected':''}>${l}</option>`).join('')}`;
function mk(o){
  const c=Object.assign({id:uid('c'),files:{},log:[],fwd:{protocol:{},vip:{}},grade:'',guests:'',vehicles:'',contact:'',beneficiary:'Self',tierReason:''},o);
  c.movements.forEach(m=>{if(!m.attendBy)m.attendBy=c.tier<=2?'Doctor':'SI';});
  return c;
}
function mv(o){return Object.assign({id:uid('m'),scope:'International',status:'Open',attendBy:'',assigned:false,actualTime:'',outcome:'',remarks:''},o);}
function acked(c,d,t1,t2){c.fwd.protocol={sentAt:stamp(d,t1),ackAt:stamp(d,t2),ackBy:'Protocol Officer (duty)'};c.fwd.vip={sentAt:stamp(d,t1),ackAt:stamp(d,t2),ackBy:'VIP Lounge In-charge'};return c;}
function done(m,actual,outcome){return Object.assign(m,{status:'Done',assigned:true,actualTime:actual||m.time,outcome:outcome||'Completed as scheduled'});}
const L=(d,t,text)=>({at:stamp(d,t),by:'Duty Doctor',text});
/* ---------- state ---------- */
/* Data lives in Firebase (Firestore). LIVE holds protocols with a flight in the last 45 days or later
   (kept in sync in real time); ARCH holds older months loaded on demand for the register and reports. */
let S={cases:[],rules:defaultRules(),rankKw:defaultRankKw(),logo:null};
const LIVE=new Map(),ARCH=new Map(),FILES=new Map(),MONTHS=new Set();
let pendingRender=false,unsubs=[],LOADERR=null,ALL_LOADED=false,LK={flights:{},people:{}};
const LIVE_DAYS=45;
function rebuild(){const m=new Map(ARCH);LIVE.forEach((v,k)=>m.set(k,v));S.cases=[...m.values()];}
function prep(c){
  const dates=c.movements.map(m=>m.date).filter(Boolean).sort();
  c.dates=dates;c.months=[...new Set(dates.map(d=>d.slice(0,7)))];
  c.firstDate=dates[0]||'';c.lastDate=dates[dates.length-1]||'';c.updatedAt=new Date().toISOString();
  return JSON.parse(JSON.stringify(c));
}
function save(c){
  if(!c||!canEdit())return;
  LIVE.set(c.id,c);rebuild();learn(c);
  Backend.saveCase(prep(c)).catch(err=>{console.error(err);toast('Could not save. '+(err&&err.code==='permission-denied'?'You do not have permission.':'Check the internet connection.'));});
}
/* ---------- learning: flight routes and officials ---------- */
const BD_AIRPORTS=['DAC','CGP','ZYL','CXB','JSR','RJH','SPD','BZL','IRD','TKR'];
const fkey=f=>String(f||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const pkey=n=>String(n||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
const codes=r=>String(r||'').toUpperCase().match(/\b[A-Z]{3}\b/g)||[];
function normRoute(r){const c=codes(r);return c.length>=2?c.join(' → '):String(r||'').trim();}
function reverseRoute(r){const c=codes(r);return c.length>=2?c.slice().reverse().join(' → '):'';}
function routeInfo(r){const c=codes(r);if(c.length<2)return null;const a=c[0],b=c[c.length-1];return {type:b==='DAC'?'Arrival':a==='DAC'?'Departure':null,scope:BD_AIRPORTS.includes(a)&&BD_AIRPORTS.includes(b)?'Domestic':'International'};}
function routeFor(f){const k=fkey(f);if(!k)return '';if(LK.flights[k]&&LK.flights[k].route)return LK.flights[k].route;
  const hit=allMv().filter(x=>fkey(x.m.flight)===k&&x.m.route).sort((a,b)=>dt(b.m)-dt(a.m))[0];return hit?hit.m.route:'';}
function knownFlights(){const m=new Map();Object.entries(LK.flights).forEach(([k,v])=>m.set(k,{flight:v.flight||k,route:v.route}));allMv().forEach(x=>{const k=fkey(x.m.flight);if(k&&x.m.route&&!m.has(k))m.set(k,{flight:x.m.flight,route:x.m.route});});return [...m.values()];}
function returnFlightFor(flight,route){const rev=reverseRoute(route);if(!rev)return '';const air=(fkey(flight).match(/^[A-Z0-9]{2}/)||[''])[0];
  const hit=knownFlights().find(f=>f.route===rev&&fkey(f.flight).startsWith(air)&&fkey(f.flight)!==fkey(flight));return hit?hit.flight:'';}
function personFor(name){const k=pkey(name);if(!k)return null;if(LK.people[k])return LK.people[k];
  const c=S.cases.filter(x=>pkey(x.vipName)===k).sort((a,b)=>String(b.updatedAt||b.lastDate||'').localeCompare(String(a.updatedAt||a.lastDate||'')))[0];
  return c?{name:c.vipName,designation:c.designation,org:c.org,grade:c.grade,contact:c.contact,tier:c.tier}:null;}
function knownPeople(){const m=new Map();Object.values(LK.people).forEach(v=>m.set(pkey(v.name),v.name));S.cases.forEach(c=>{const k=pkey(c.vipName);if(k&&!m.has(k))m.set(k,c.vipName);});return [...m.values()].sort();}
function learn(c){
  if(!Backend.saveLookups)return;
  const fl={},pe={};
  c.movements.forEach(m=>{const k=fkey(m.flight);if(k&&m.route&&m.status!=='Cancelled'&&(!LK.flights[k]||LK.flights[k].route!==m.route)){fl[k]={flight:m.flight,route:m.route};LK.flights[k]=fl[k];}});
  const k=pkey(c.vipName);
  if(k){const v={name:c.vipName,designation:c.designation||'',org:c.org||'',grade:c.grade||'',contact:c.contact||'',tier:c.tier};if(JSON.stringify(LK.people[k]||{})!==JSON.stringify(v)){pe[k]=v;LK.people[k]=v;}}
  const o={};if(Object.keys(fl).length)o.flights=fl;if(Object.keys(pe).length)o.people=pe;
  if(Object.keys(o).length)Backend.saveLookups(o).catch(e=>console.error(e));
}
function needAll(){
  if(ALL_LOADED||!Backend.loadAll)return;ALL_LOADED=true;
  Backend.loadAll().then(list=>{list.forEach(c=>{if(!LIVE.has(c.id))ARCH.set(c.id,c);});rebuild();refreshSoon();}).catch(e=>{ALL_LOADED=false;console.error(e);toast('Could not load older protocols.');});
}
/* ---------- phone numbers ---------- */
function phonesIn(str){return (String(str||'').match(/\+?\d[\d\s-]{7,}\d/g)||[]).filter(x=>{const d=x.replace(/\D/g,'');return d.length>=10&&d.length<=14;});}
function telOf(x){return x.replace(/[^\d+]/g,'');}
function contactHtml(str){
  const s=String(str||'');if(!s)return '';let out='',last=0;const re=/\+?\d[\d\s-]{7,}\d/g;let m;
  while((m=re.exec(s))){const d=m[0].replace(/\D/g,'');if(d.length<10||d.length>14)continue;out+=esc(s.slice(last,m.index))+`<a class="tel" href="tel:${telOf(m[0])}">${ICON_PHONE}${esc(m[0])}</a>`;last=m.index+m[0].length;}
  return out+esc(s.slice(last));
}
const ICON_PHONE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
const ICON_CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
/* ---------- file picking (camera or file) ---------- */
const PICK={};
function fileField(id,label){delete PICK[id];
  return `<div class="f"><span>${label}</span><div class="filepick" id="${id}">
    <label class="btn sm">${ICON_CAM}Take photo<input type="file" accept="image/*" capture="environment" data-pick="${id}" hidden></label>
    <label class="btn sm">Choose file<input type="file" accept="image/*,application/pdf" data-pick="${id}" hidden></label>
    <span class="fname small muted">No file chosen</span></div></div>`;}
function downloadText(name,text){
  try{const blob=new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);toast('Downloading '+name);}
  catch(e){openModal(`${mHead('Copy the data','Select all and copy, then paste into Excel.')}<textarea style="min-height:220px" class="mono small" readonly>${esc(text)}</textarea><div class="btnrow"><button class="btn" data-act="close">Close</button></div>`);}
}
function csvOf(list){
  const head=['Date','Time','Actual time','Arr/Dep','Scope','Flight','Route','Name','Designation','Office','Beneficiary','Contact','Vehicles','Category','Grade/Status','Attended by','Status','Remarks'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  return [head.map(q).join(',')].concat(list.map(({c,m})=>[dmy(m.date),m.time,m.actualTime,m.type,m.scope,m.flight,m.route,c.vipName,c.designation,c.org,c.beneficiary==='Family/Guest'?c.guests:'Self',c.contact,c.vehicles,catName(c.tier),rankLabel(rankOf(c)),m.assigned||m.status==='Done'?WHO[m.attendBy]:'Not assigned',mvStatus(m)[0],m.remarks].map(q).join(','))).join('\n');
}
function saveSettings(){
  if(!canEdit())return;
  Backend.saveSettings({rulesVersion:2,rules:S.rules,rankKw:S.rankKw,logo:S.logo||null}).catch(err=>{console.error(err);toast('Could not save settings.');});
}
function refreshSoon(){
  const nav=currentNav();
  if(!$('#modal').hidden||(nav==='new'&&$('#newForm'))){pendingRender=true;return;}
  if(nav==='register'&&$('#regTable')){$('#regTable').innerHTML=regTable();renderBoard();paintTabs(nav);return;}
  render();
}
function needMonth(month){
  if(!month||MONTHS.has(month))return;
  if(month>addDays(-LIVE_DAYS).slice(0,7))return; // fully covered by the live sync
  MONTHS.add(month);
  Backend.loadMonth(month).then(list=>{list.forEach(c=>ARCH.set(c.id,c));rebuild();refreshSoon();}).catch(err=>{MONTHS.delete(month);console.error(err);toast('Could not load '+month+'.');});
}
function startData(){
  unsubs.forEach(u=>{try{u();}catch(e){}});
  unsubs=[
    Backend.watchRecent(addDays(-LIVE_DAYS),list=>{LOADERR=null;LIVE.clear();list.forEach(c=>LIVE.set(c.id,c));rebuild();READY=true;refreshSoon();},err=>{console.error(err);READY=true;LOADERR={code:(err&&err.code)||'unknown',msg:(err&&err.message)||''};render();}),
    Backend.watchSettings(d=>{S.rules=(d&&d.rulesVersion===2&&d.rules)||defaultRules();S.rankKw=(d&&d.rulesVersion===2&&d.rankKw)||defaultRankKw();S.logo=(d&&d.logo)||null;paintLogo();refreshSoon();}),
    Backend.watchLookups?Backend.watchLookups(d=>{LK.flights=(d&&d.flights)||{};LK.people=(d&&d.people)||{};}):()=>{}
  ];
}
function stopData(){LOADERR=null;ALL_LOADED=false;LK={flights:{},people:{}};unsubs.forEach(u=>{try{u();}catch(e){}});unsubs=[];LIVE.clear();ARCH.clear();MONTHS.clear();FILES.clear();rebuild();READY=false;}
const canEdit=()=>MODE==='doctor';
const caseById=id=>S.cases.find(c=>c.id===id);
const allMv=()=>S.cases.flatMap(c=>c.movements.map(m=>({c,m})));
const rule=t=>(S.rules||defaultRules()).find(r=>r.tier===Number(t))||(S.rules||defaultRules())[2];
const handlerOf=t=>rule(t).handler;
const catName=t=>rule(t).name;
function addLog(c,text){c.log.push({at:nowStamp(),by:'Duty Doctor',text});}

/* ---------- category rules ---------- */
function inferRank(designation){
  const d=' '+String(designation||'').toLowerCase().replace(/[^a-z0-9\-]+/g,' ')+' ';
  let best=null;const kw=S.rankKw||defaultRankKw();
  Object.keys(RANK_TIER).forEach(rk=>String(kw[rk]||'').split(',').map(k=>k.trim().toLowerCase()).filter(Boolean).forEach(k=>{
    const re=new RegExp('[^a-z0-9]'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'[^a-z0-9]+')+'[^a-z0-9]');
    if(re.test(d)&&(!best||k.length>best.k.length))best={k,rank:rk};
  }));
  return best;
}
function classify(designation,grade){
  const g=normGrade(grade);
  if(g)return {tier:RANK_TIER[g],rank:g,reason:rankLabel(g)};
  const b=inferRank(designation);
  if(b)return {tier:RANK_TIER[b.rank],rank:b.rank,reason:rankLabel(b.rank)+' (from “'+b.k+'”)'};
  return {tier:3,rank:'',reason:'Rank not known, so Courtesy applies. Set Grade/Status to change it'};
}
const rankOf=c=>normGrade(c.grade)||((inferRank(c.designation)||{}).rank)||'';
const RANK_IDX={MIN:0,'1':1,'2':2,'3':3,'4':4,'':5};
const mvCmp=(a,b)=>(dt(a.m)-dt(b.m))||(Number(a.c.tier)-Number(b.c.tier))||(RANK_IDX[rankOf(a.c)]-RANK_IDX[rankOf(b.c)]);

/* ---------- status ---------- */
function caseStage(c){
  const p=c.fwd.protocol,v=c.fwd.vip;
  if(!p.sentAt&&!v.sentAt)return 0;
  if(!(p.ackAt&&v.ackAt))return 1;
  const act=c.movements.filter(m=>m.status!=='Cancelled');
  if(act.length&&act.every(m=>m.status==='Done'))return 3;
  return 2;
}
const STAGES=['Registered','Forwarded','Signed copy received','Completed'];
function mvStatus(m){
  if(m.status==='Cancelled')return ['Cancelled','muted'];
  if(m.status==='Done')return ['Completed','ok'];
  if(dt(m)<Date.now())return ['Report pending','warn'];
  if(!m.assigned)return ['Not assigned','warn'];
  return ['Scheduled','info'];
}
const pill=([t,k])=>`<span class="pill ${k}">${esc(t)}</span>`;
const catBadge=t=>`<span class="cat ${CATCLS[Number(t)]||'cour'}">${esc(catName(t))}</span>`;
function attHtml(m){
  if(m.status==='Cancelled')return '';
  if(!m.assigned&&m.status==='Open')return `<span class="att none">${ICON.none}Needs ${WHO[m.attendBy]}</span>`;
  return `<span class="att">${m.attendBy==='SI'?ICON.si:ICON.doc}${WHO[m.attendBy]}</span>`;
}
const isOpenFuture=m=>m.status==='Open'&&dt(m).getTime()>Date.now()-6*36e5;
const needsContact=c=>!String(c.contact||'').trim()&&c.movements.some(isOpenFuture);
const awaitingAck=c=>caseStage(c)<2&&c.movements.some(isOpenFuture);
function actionItems(){
  const now=Date.now(),items=[];
  S.cases.forEach(c=>{
    const live=c.movements.filter(isOpenFuture);
    if(live.length){
      const next=Math.min(...live.map(m=>dt(m).getTime()));
      const urgent=(next-now)<=24*36e5,st=caseStage(c);
      if(st===0)items.push({sev:urgent?'crit':'warn',c,text:'Forward letter to Protocol and VIP lounge sections',due:next});
      else ['protocol','vip'].forEach(k=>{const f=c.fwd[k];if(f.sentAt&&!f.ackAt)items.push({sev:urgent?'crit':'warn',c,text:'Signed copy pending from '+SEC[k],due:next});});
      if(needsContact(c))items.push({sev:urgent?'crit':'warn',c,text:'Add a contact number',due:next});
      live.forEach(m=>{const h=(dt(m).getTime()-now)/36e5;if(!m.assigned&&h<=48)items.push({sev:h<=24?'crit':'warn',c,text:'Assign '+WHO[m.attendBy]+' for '+m.flight,due:dt(m).getTime()});});
    }
    c.movements.forEach(m=>{if(m.status==='Open'&&dt(m).getTime()<now)items.push({sev:'warn',c,text:'Record completion for '+m.flight,due:dt(m).getTime()});});
  });
  return items.sort((a,b)=>(a.sev===b.sev?0:(a.sev==='crit'?-1:1))||a.due-b.due);
}

/* ---------- fragments ---------- */
const TICK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function tickBtn(c,m){
  if(m.status==='Cancelled'||!canEdit())return '';
  const on=m.status==='Done';
  return `<button type="button" class="tick${on?' on':''}" data-act="tick" data-case="${c.id}" data-mv="${m.id}" aria-pressed="${on}" aria-label="${on?'Mark '+esc(m.flight)+' as not done':'Mark '+esc(m.flight)+' as done'}" title="${on?'Done. Tap to undo':'Mark as done'}">${TICK}</button>`;
}
function toggleDone(c,m){
  if(m.status==='Done'){m.status='Open';m.actualTime='';m.outcome='';addLog(c,m.flight+' marked as not done');save(c);render();toast(m.flight+' marked as not done');}

/* Attachments are stored inside Firestore (collection "files") so the free Spark plan is enough.
   Photos are shrunk to about 1600 px JPEG; PDFs must be under 700 KB (Firestore's limit is 1 MB per document). */
function compressImage(file,maxDim,q){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,maxDim/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      let d=cv.toDataURL('image/jpeg',q);if(d.length>850000)d=cv.toDataURL('image/jpeg',0.45);
      if(d.length>950000)return rej(new Error('This photo is too large even after shrinking. Take it again at a lower resolution.'));
      res(d);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read this image.'));};
    img.src=url;
  });
}
async function prepareFile(input,maxDim){
  const f=input&&input.files?input.files[0]:input;if(!f)return null;
  if(/^image\//.test(f.type))return {name:f.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',data:await compressImage(f,maxDim||1600,0.7)};
  if(f.type==='application/pdf'){
    if(f.size>700*1024)throw new Error('This PDF is larger than 700 KB. Attach a photo of the letter instead, or compress the PDF.');
    const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Could not read the PDF.'));r.readAsDataURL(f);});
    return {name:f.name,type:f.type,data};
  }
  throw new Error('Attach a photo or a PDF.');
}
async function storeFile(c,key,input){
  const f=await prepareFile(input);if(!f)return null;
  const r=Backend.putFile({caseId:c.id,key,name:f.name,type:f.type,data:f.data,at:nowStamp()});
  r.done.catch(err=>{console.error(err);toast('Could not upload '+f.name+'.');});
  FILES.set(r.id,f);c.files[key]={id:r.id,name:f.name,type:f.type};
  return c.files[key];
}

function parsePlace(v){
  v=String(v||'').trim();if(!v)return '';
  const m=v.match(/\(([A-Za-z]{3})\)\s*$/);if(m)return m[1].toUpperCase();
  if(/^[A-Za-z]{3}$/.test(v)&&(APN.has(v.toUpperCase())||v===v.toUpperCase()))return v.toUpperCase();
  const lv=v.toLowerCase();const ex=AIRPORTS.find(([c,n])=>n.toLowerCase()===lv);if(ex)return ex[0];
  const st=AIRPORTS.filter(([c,n])=>n.toLowerCase().startsWith(lv));if(st.length===1)return st[0][0];
  if(/^[A-Za-z]{3}$/.test(v))return v.toUpperCase();
  return v; // a place not in the list is kept as typed
}

function normFlight(f){const x=String(f||'').toUpperCase().replace(/\s+/g,'');const m=x.match(/^([A-Z0-9]{2})-?(\d{1,4}[A-Z]?)$/);return m?m[1]+'-'+m[2]:x;}

function rowAuto(row,src){
  const fl=$('[name=flight]',row),pl=$('[name=place]',row),ty=$('[name=type]',row),sc=$('[name=scope]',row);if(!fl||!pl)return;

}

function openModal(html,onMount){const b=$('#modalBody');b.innerHTML=html;$('#modal').hidden=false;if(onMount)onMount(b);const f=b.querySelector('input,select,textarea');if(f)f.focus();}

  const isNew=!m,v=m||preset||{date:todayStr()};
  openModal(`<form class="formsec" id="mf">${mHead(isNew?(preset&&preset.route?'Add return flight':'Add flight'):'Edit flight '+m.flight,esc(c.vipName+', '+c.designation))}

      if(isNew){c.movements.push(mv(Object.assign(x,{attendBy:handlerOf(c.tier)})));addLog(c,`Flight added: ${x.flight} ${dmy(x.date)} ${x.time}`);}

        if(!ch.length){closeModal();return;}Object.assign(m,x);addLog(c,`${m.flight} changed: ${ch.join(', ')}`);}
      save(c);closeModal();render();toast(isNew?'Flight added':'Flight updated');};});

function summaryText(kind){
  const T=todayStr(),M=tomorrowStr(),now=Date.now();let list=allMv().filter(x=>x.m.status!=='Cancelled'),title;
  if(kind==='tomorrow'){list=list.filter(x=>x.m.date===M);title='Tomorrow, '+dmy(M);}
  else if(kind==='24h'){list=list.filter(x=>{const t=dt(x.m).getTime();return t>=now-36e5&&t<=now+24*36e5;});title='Next 24 hours (from '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+')';}
  else{list=list.filter(x=>x.m.date===T);title='Today, '+dmy(T);}
  list.sort(mvCmp);
  const L=['*HSIA Airport Health Office*','*Protocols: '+title+'*',''];
  if(!list.length)L.push('No protocols.');
  list.forEach(({c,m},i)=>{L.push(`${i+1}. ${m.status==='Done'?'✅ ':''}*${m.time}* ${m.type==='Arrival'?'ARR':'DEP'} ${m.flight}${m.route?' ('+m.route+')':''}`);
    L.push(`    ${c.vipName}, ${c.designation}${c.org?', '+c.org:''} [${catName(c.tier)}${rankLabel(rankOf(c))&&rankOf(c)!=='MIN'?' · '+rankLabel(rankOf(c)):''}]`);
    L.push(`    Attended by: ${m.assigned||m.status==='Done'?WHO[m.attendBy]:'Not assigned'}${c.contact?' | Contact: '+c.contact:''}`);
    if(c.vehicles)L.push('    Vehicles: '+c.vehicles);L.push('');});
  L.push(`Total ${list.length} · Done ${list.filter(x=>x.m.status==='Done').length}`);
  return L.join('\n');
}

async function mFile(c,key){
  const meta=c&&c.files[key];if(!meta)return;
  openModal(`${mHead(meta.name)}<p class="muted" id="fileBody" style="margin:0">Loading…</p><div class="btnrow"><button class="btn" data-act="close">Close</button></div>`);
  try{
    let f=FILES.get(meta.id);if(!f){f=await Backend.getFile(meta.id);if(f)FILES.set(meta.id,f);}
    const body=$('#fileBody');if(!body)return;
    if(!f)throw new Error('missing');
    if(/^image\//.test(f.type))body.outerHTML=`<img class="full" src="${f.data}" alt="${esc(meta.name)}">`;
    else{const blob=await (await fetch(f.data)).blob();const u=URL.createObjectURL(blob);body.outerHTML=`<a class="btn primary" href="${u}" target="_blank" rel="noopener">Open PDF</a>`;}
  }catch(err){const b=$('#fileBody');if(b)b.textContent='Could not load this file. Check the internet connection and try again.';}
}

/* ---------- render + routing ---------- */
const VIEWS={today:vToday,register:vRegister,reports:vReports,settings:vSettings,new:vNew};
const tabsFor=()=>MODE==='doctor'
  ?[['today','Today'],['register','Register'],['reports','Reports']]
  :[['today','Today'],['register','Register']];
function currentNav(){const h=(location.hash||'#today').slice(1);if(h.startsWith('case-'))return 'register';return (VIEWS[h]&&(canEdit()||['today','register'].includes(h)))?h:'today';}
function paintTabs(nav){
  if(!USER){$('#tabs').innerHTML='<a aria-current="page">Sign in</a>';return;}
  const crit=canEdit()&&READY?actionItems().filter(i=>i.sev==='crit').length:0;
  $('#tabs').innerHTML=tabsFor().map(([k,l])=>`<a href="#${k}" aria-current="${nav===k?'page':'false'}">${l}${k==='today'&&crit?` <span class="count">${crit}</span>`:''}</a>`).join('')

    ;
  const gear=$('#gear');if(gear){gear.hidden=!canEdit();gear.setAttribute('aria-current',nav==='settings'?'page':'false');}

function render(){
  pendingRender=false;
  if(!USER){$('#view').innerHTML=vLogin();paintTabs('');renderBoard();return;}
  if(!READY){$('#view').innerHTML='<div class="card empty">Loading protocols…</div>';paintTabs(currentNav());renderBoard();return;}
  const h=(location.hash||'#today').slice(1);
  const nav=currentNav();
  if(nav==='register')needMonth(regF.month);
  if(nav==='reports')needMonth(repMonth);
  const HINT={'permission-denied':'The database refused this account. In Firebase → Firestore → Rules, check the rules were pasted in full and Published, and that the e-mails in the rules match the users exactly.',
    'failed-precondition':'The Firestore database is not ready. In Firebase → Databases & Storage → Firestore, check a database named (default) exists.',
    'not-found':'No Firestore database named (default) was found in this project. Create it under Databases & Storage → Firestore with Database ID (default).',
    'unavailable':'Firebase could not be reached. Check the internet connection.'};
  const errBox=LOADERR?`<div class="card" style="border-color:var(--vvip)"><h2 style="color:var(--vvip)">Could not load protocols</h2><p style="margin:8px 0 0">${esc(HINT[LOADERR.code]||'Firebase returned an error.')}</p><p class="small muted mono" style="margin:8px 0 0;overflow-wrap:anywhere">Code: ${esc(LOADERR.code)} · ${esc(LOADERR.msg).slice(0,300)}</p></div>`:'';
  $('#view').innerHTML=errBox+(h.startsWith('case-')?vCase(h.slice(5)):VIEWS[nav]());
  paintTabs(nav);
  renderBoard();
  const pd=$('#printdate');if(pd)pd.textContent=new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  if(nav==='new'){['#f-des','#f-grade','#f-ben'].forEach(s=>$(s).addEventListener('input',updateCatBox));updateCatBox();}
}
